<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo Master - GamesBoy.net</title>
  
  <link rel="icon" type="image/png" href="/assets/branding/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css?v=6.0">
  
  <style>
    .admin-login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background: #080a10;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(0, 194, 255, 0.05) 0%, transparent 50%);
    }
    .admin-login-box {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(145deg, #121520 0%, #171b28 100%);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 2.5rem 2.25rem;
      border-radius: 20px !important;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 25px rgba(245, 158, 11, 0.15);
      position: relative;
      overflow: hidden;
    }
    .admin-login-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #f59e0b, #00c2ff, #10b981);
    }
    .badge-master-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #f59e0b;
      padding: 4px 12px;
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 20px !important;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }
    .form-group-admin {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .form-label-admin {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-input-admin {
      width: 100%;
      background: rgba(5, 7, 14, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 12px 14px;
      border-radius: 10px !important;
      font-size: 0.88rem;
      font-family: var(--font-sans);
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    .form-input-admin:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.25);
      background: rgba(8, 11, 20, 0.95);
    }
    .btn-admin-submit {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #040c1e;
      border: none;
      padding: 13px 20px;
      font-size: 0.92rem;
      font-weight: 800;
      border-radius: 10px !important;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.35);
    }
    .btn-admin-submit:hover {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.5);
    }
  </style>
</head>
<body>

  <div class="admin-login-wrap">
    <div class="admin-login-box">
      
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <a href="/" title="GamesBoy.net">
          <img src="/assets/branding/logo-white.png?v=6.0" alt="GamesBoy.net" style="height: 38px; width: auto; filter: none; margin-bottom: 0.85rem;">
        </a>
        <div>
          <span class="badge-master-tag">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
            Portal de Administrador Master
          </span>
        </div>
        <h1 style="font-family: var(--font-heading); font-size: 1.4rem; font-weight: 800; color: #ffffff; margin-bottom: 4px;">
          Control & Gestión Global
        </h1>
        <p style="font-size: 0.82rem; color: var(--text-tertiary);">
          Acceso restringido para finanzas, catálogo y usuarios
        </p>
      </div>

      <form id="form-admin-login">
        <div class="form-group-admin">
          <label class="form-label-admin">Correo Electrónico Administrador</label>
          <input type="email" id="admin-user-input" class="form-input-admin" placeholder="admin@gamesboy.net" required autocomplete="username">
        </div>

        <div class="form-group-admin">
          <label class="form-label-admin">Clave de Seguridad Master</label>
          <input type="password" id="admin-pass-input" class="form-input-admin" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-admin-submit" id="btn-admin-submit">
          <span>Entrar al Panel de Control</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 1rem;">
        <a href="/" style="font-size: 0.8rem; color: var(--text-tertiary); text-decoration: none;">← Volver al Marketplace Público</a>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById('form-admin-login');
    const userInput = document.getElementById('admin-user-input');
    const passInput = document.getElementById('admin-pass-input');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = userInput.value.trim();
      const password = passInput.value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, portalType: 'admin' })
        });
        const data = await res.json();
        if (res.ok && data.success && data.user && (data.user.role === 'admin' || data.user.email === 'admin@gamesboy.net')) {
          localStorage.setItem('gb_admin_session', JSON.stringify(data.user));
          localStorage.setItem('gb_user', JSON.stringify(data.user));
          if (data.token) localStorage.setItem('gb_token', data.token);
          window.location.href = '/admin';
        } else {
          alert(data.error || 'Credenciales administrativas incorrectas.');
        }
      } catch (err) {
        alert('Error al conectar con el servidor de autenticación.');
      }
    });
  </script>
</body>
</html>
