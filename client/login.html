<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro | GamesBoy.net</title>
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 20%, var(--bg-surface) 0%, var(--bg-base) 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-normal);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    .auth-tab.active {
      color: var(--text-main);
      border-color: var(--accent-blue);
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="font-size: 36px; margin-bottom: 8px;">🎮</div>
        <h1 style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px;">GamesBoy</h1>
        <p style="font-size: 13px; color: var(--text-muted);">Acceso a tu cuenta y billetera</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin">Iniciar Sesión</div>
        <div class="auth-tab" id="tabRegister">Registrarse</div>
      </div>

      <!-- Login Form -->
      <form id="formLogin">
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Correo Electrónico</label>
          <input type="email" class="input" id="loginEmail" placeholder="usuario@correo.com" required value="admin@gamesboy.net">
        </div>
        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Contraseña</label>
          <input type="password" class="input" id="loginPassword" placeholder="••••••••" required value="GamesBoy2026!">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">Ingresar a la Plataforma</button>
      </form>

      <!-- Register Form -->
      <form id="formRegister" style="display: none;">
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 13px; margin-bottom: 6px;">Nombre Completo</label>
          <input type="text" class="input" id="regName" placeholder="Tu Nombre">
        </div>
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 13px; margin-bottom: 6px;">Correo Electrónico</label>
          <input type="email" class="input" id="regEmail" placeholder="correo@ejemplo.com" required>
        </div>
        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 13px; margin-bottom: 6px;">Contraseña</label>
          <input type="password" class="input" id="regPassword" placeholder="Mínimo 8 caracteres" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">Crear Mi Cuenta</button>
      </form>

      <div style="text-align: center; margin-top: 16px;">
        <a href="/" style="font-size: 13px; color: var(--text-dim); text-decoration: underline;">← Volver a la Tienda</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { API } from '/js/api.js';

    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const formLogin = document.getElementById('formLogin');
    const formRegister = document.getElementById('formRegister');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      formLogin.style.display = 'block';
      formRegister.style.display = 'none';
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      formRegister.style.display = 'block';
      formLogin.style.display = 'none';
    });

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;

      try {
        const res = await API.login(email, pass);
        if (res.user && res.user.role === 'ADMIN') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/';
        }
      } catch (err) {
        alert(err.message || 'Error al iniciar sesión');
      }
    });

    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      try {
        await API.register({ email, password, fullName });
        alert('Cuenta creada exitosamente. Iniciando sesión...');
        await API.login(email, password);
        window.location.href = '/';
      } catch (err) {
        alert(err.message || 'Error al registrar');
      }
    });
  </script>
</body>
</html>
